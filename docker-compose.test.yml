services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: alibooks_test
      POSTGRES_USER: alibooks_test
      POSTGRES_PASSWORD: integration_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U alibooks_test -d alibooks_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend-test:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    command: ["mvn", "-B", "clean", "-Pintegration", "verify"]
    environment:
      TEST_DATABASE_URL: jdbc:postgresql://postgres:5432/alibooks_test
      TEST_DATABASE_USERNAME: alibooks_test
      TEST_DATABASE_PASSWORD: integration_only
    volumes:
      - ./backend:/workspace
      - ./.m2-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
