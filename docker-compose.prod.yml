services:
  frontend:
    image: ${DOCKERHUB_USERNAME}/cloudshop-frontend:${IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${TLS_CERT_HOST_PATH}:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_KEY_HOST_PATH}:/etc/nginx/certs/privkey.pem:ro
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ${DOCKERHUB_USERNAME}/cloudshop-backend:${IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    volumes:
      - receipt_uploads:/app/uploads
      - ${RDS_CA_CERT_HOST_PATH}:/run/certs/rds-ca-bundle.pem:ro
    expose:
      - "3000"
    environment:
      - SERVER_PORT=3000
      - APP_ENV=production
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      - APP_SCHEMA_PATCH_ENABLED=${APP_SCHEMA_PATCH_ENABLED:-false}
      - APP_MONEY_MIGRATION_VERIFY_ON_STARTUP=${APP_MONEY_MIGRATION_VERIFY_ON_STARTUP:-true}
      - APP_MONEY_MIGRATION_FULL_CHECK_CRON=${APP_MONEY_MIGRATION_FULL_CHECK_CRON:-0 0 2 * * *}
      - APP_MONEY_MIGRATION_MAX_FULL_CHECK_AGE_HOURS=${APP_MONEY_MIGRATION_MAX_FULL_CHECK_AGE_HOURS:-26}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-60}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL}
      - APP_TIME_ZONE=${APP_TIME_ZONE:-Europe/Stockholm}
      - APP_INVOICE_REMINDERS_CRON=${APP_INVOICE_REMINDERS_CRON:-0 0 9 * * *}
      - APP_TEST_DATA_RESET_ENABLED=${APP_TEST_DATA_RESET_ENABLED:-false}
      - APP_BANK_RECONCILIATION_RESET_ENABLED=${APP_BANK_RECONCILIATION_RESET_ENABLED:-false}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      - APP_CORS_LOCAL_DEV_ENABLED=${APP_CORS_LOCAL_DEV_ENABLED:-false}
      - APP_AUTH_MAX_FAILED_LOGIN_ATTEMPTS=${APP_AUTH_MAX_FAILED_LOGIN_ATTEMPTS:-5}
      - APP_AUTH_LOGIN_LOCK_MINUTES=${APP_AUTH_LOGIN_LOCK_MINUTES:-15}
      - APP_AUTH_LOGIN_ATTEMPT_CACHE_MAX_ENTRIES=${APP_AUTH_LOGIN_ATTEMPT_CACHE_MAX_ENTRIES:-10000}
      - APP_AUTH_LOGIN_ATTEMPT_RETENTION_MINUTES=${APP_AUTH_LOGIN_ATTEMPT_RETENTION_MINUTES:-15}
      - APP_AUTH_REGISTRATION_BOOTSTRAP_KEY=${APP_AUTH_REGISTRATION_BOOTSTRAP_KEY}
      - APP_AUTH_MFA_ENCRYPTION_KEY=${APP_AUTH_MFA_ENCRYPTION_KEY}
      - APP_AUTH_REQUIRE_MFA=${APP_AUTH_REQUIRE_MFA:-true}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_MODEL=${HF_MODEL:-moonshotai/Kimi-K2-Instruct-0905}
      - HF_BASE_URL=${HF_BASE_URL:-https://router.huggingface.co/v1}
      - AI_OPENAI_API_KEY=${AI_OPENAI_API_KEY:-}
      - AI_OPENAI_MODEL=${AI_OPENAI_MODEL:-}
      - AI_OPENAI_BASE_URL=${AI_OPENAI_BASE_URL:-}
      - AI_OPENAI_PROVIDER_NAME=${AI_OPENAI_PROVIDER_NAME:-openai-compatible}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_MAIL_SMTP_AUTH=${SPRING_MAIL_SMTP_AUTH:-true}
      - SPRING_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
      - SPRING_MAIL_SMTP_STARTTLS_REQUIRED=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:-true}
      - SPRING_MAIL_SMTP_CHECK_SERVER_IDENTITY=${SPRING_MAIL_SMTP_CHECK_SERVER_IDENTITY:-true}
      - SPRING_MAIL_CONNECTION_TIMEOUT_MS=${SPRING_MAIL_CONNECTION_TIMEOUT_MS:-5000}
      - SPRING_MAIL_READ_TIMEOUT_MS=${SPRING_MAIL_READ_TIMEOUT_MS:-10000}
      - SPRING_MAIL_WRITE_TIMEOUT_MS=${SPRING_MAIL_WRITE_TIMEOUT_MS:-10000}

volumes:
  receipt_uploads:
