name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudshop
          POSTGRES_PASSWORD: cloudshop
          POSTGRES_DB: cloudshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudshop -d cloudshop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cloudshop
      SPRING_DATASOURCE_USERNAME: cloudshop
      SPRING_DATASOURCE_PASSWORD: cloudshop
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_SCHEMA_PATCH_ENABLED: "true"
      JWT_SECRET: ci_test_secret_must_be_long_enough_for_demo
      APP_FRONTEND_URL: http://localhost:5157
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test backend
        working-directory: backend
        run: mvn -B test

      - name: Test application startup and accounting transactions
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/alibooks_test
          TEST_DATABASE_USERNAME: cloudshop
          TEST_DATABASE_PASSWORD: cloudshop
          PGPASSWORD: cloudshop
        run: |
          createdb -h localhost -U cloudshop alibooks_test
          mvn -B -Pintegration verify

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/pdf-proof/*.pdf
          if-no-files-found: warn
          retention-days: 14

      - name: Write backend summary
        if: always()
        run: |
          echo "## AliBooks backend evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Maven test reports: backend-surefire-reports artifact" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm run check:audit

      - name: Test report error handling and numeric contracts
        run: npm run test:reports

      - name: Install pinned headless test browser
        env:
          CHROME_TEST_VERSION: "153.0.8010.36"
        run: |
          curl --fail --location --retry 3 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_TEST_VERSION}/linux64/chrome-headless-shell-linux64.zip" \
            --output "$RUNNER_TEMP/alibooks-headless.zip"
          unzip -q "$RUNNER_TEMP/alibooks-headless.zip" -d "$RUNNER_TEMP/alibooks-browser"
          browser="$RUNNER_TEMP/alibooks-browser/chrome-headless-shell-linux64/chrome-headless-shell"
          test -x "$browser"
          "$browser" --version
          echo "CHROME_PATH=$browser" >> "$GITHUB_ENV"

      - name: Run frontend release gate
        working-directory: frontend
        run: npm run check:release

      - name: Upload frontend production bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: warn
          retention-days: 14

      - name: Write frontend summary
        if: always()
        run: |
          echo "## AliBooks frontend evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release gate: npm run check:release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production bundle: frontend-dist artifact" >> "$GITHUB_STEP_SUMMARY"

  backup-restore:
    name: Isolated backup and receipt restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test database and receipt restore
        run: npm run test:backup
      - name: Test PowerShell backup failure handling
        shell: pwsh
        run: ./scripts/backup-scripts-test.ps1
      - name: Test shell backup TLS guards
        shell: bash
        run: |
          sh ./scripts/backup-shell-safety-test.sh
          if output="$(PGHOST=remote.invalid PGDATABASE=fixture PGUSER=fixture PGPASSWORD=synthetic PGSSLMODE=require sh ./scripts/backup-postgres.sh 2>&1)"; then
            echo "Remote backup accepted weak TLS"
            exit 1
          fi
          [[ "$output" == *"requires PGSSLMODE=verify-full"* ]]
          if output="$(PGHOST=remote.invalid PGDATABASE=fixture PGUSER=fixture PGPASSWORD=synthetic sh ./scripts/backup-postgres.sh 2>&1)"; then
            echo "Remote backup accepted missing CA certificate"
            exit 1
          fi
          [[ "$output" == *"RDS_CA_CERT_HOST_PATH"* ]]
          if output="$(PGHOST=remote.invalid PGDATABASE=alibooks_restore_test PGUSER=fixture PGPASSWORD=synthetic RESTORE_FILE=synthetic.dump RESTORE_CONFIRM=RESTORE_TO_TEST_DATABASE PGSSLMODE=require sh ./scripts/restore-postgres.sh 2>&1)"; then
            echo "Remote restore accepted weak TLS"
            exit 1
          fi
          [[ "$output" == *"requires PGSSLMODE=verify-full"* ]]

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend
      - frontend
      - backup-restore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cloudshop-backend:ci ./backend

      - name: Build frontend image
        run: docker build -f ./frontend/Dockerfile.prod -t cloudshop-frontend:ci ./frontend

      - name: Verify frontend container API configuration
        run: |
          mock_nginx='set -e; mkdir -p /tmp/mock; printf "#!/bin/sh\nexit 0\n" > /tmp/mock/nginx; chmod +x /tmp/mock/nginx; PATH="/tmp/mock:$PATH" /docker-entrypoint.sh'
          docker run --rm --entrypoint sh -e VITE_API_URL=/api cloudshop-frontend:ci -c "$mock_nginx; grep -F /api /usr/share/nginx/html/config.js"
          if docker run --rm --entrypoint sh -e VITE_API_URL=http://localhost:3000 cloudshop-frontend:ci -c "$mock_nginx"; then
            echo "Production frontend accepted a localhost API URL" >&2
            exit 1
          fi
          if docker run --rm --entrypoint sh cloudshop-frontend:ci -c "$mock_nginx"; then
            echo "Production frontend accepted a missing API URL" >&2
            exit 1
          fi

      - name: Smoke test production frontend over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          cert_dir="$(mktemp -d)"
          network="alibooks-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          backend="${network}-backend"
          container="${network}-frontend"
          cleanup() {
            if [ "$?" -ne 0 ]; then
              docker logs "$container" >&2 || true
              docker logs "$backend" >&2 || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker rm -f "$backend" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            rm -rf "$cert_dir"
          }
          trap cleanup EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$cert_dir/privkey.pem" -out "$cert_dir/fullchain.pem" \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" >/dev/null 2>&1
          docker network create "$network"
          docker run -d --name "$backend" --network "$network" --network-alias backend \
            node:24-alpine node -e 'require("node:http").createServer((req, res) => { res.end(JSON.stringify({path: req.url})); }).listen(3000)'
          docker run -d --name "$container" --network "$network" -e VITE_API_URL=/api \
            -p 127.0.0.1::443 -v "$cert_dir:/etc/nginx/certs:ro" cloudshop-frontend:ci
          published_port="$(docker port "$container" 443/tcp)"
          published_port="${published_port##*:}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --insecure \
              "https://127.0.0.1:$published_port/" -o "$cert_dir/index.html" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          grep -F 'id="root"' "$cert_dir/index.html"
          curl --fail --silent --show-error --insecure \
            "https://127.0.0.1:$published_port/config.js" -o "$cert_dir/config.js"
          grep -F 'apiUrl: "/api"' "$cert_dir/config.js"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --insecure \
              "https://127.0.0.1:$published_port/api/health" -o "$cert_dir/api-health.json" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          grep -F '"path":"/health"' "$cert_dir/api-health.json"

      - name: Write Docker summary
        if: always()
        run: |
          echo "## AliBooks Docker evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend image: cloudshop-backend:ci" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend image: cloudshop-frontend:ci" >> "$GITHUB_STEP_SUMMARY"
