name: Dockerhub

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release before Dockerhub publish
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate CI contract and report tests
        run: |
          npm run check:ci
          npm run test:reports

      - name: Install pinned headless test browser
        env:
          CHROME_TEST_VERSION: "153.0.8010.36"
        run: |
          curl --fail --location --retry 3 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_TEST_VERSION}/linux64/chrome-headless-shell-linux64.zip" \
            --output "$RUNNER_TEMP/alibooks-headless.zip"
          unzip -q "$RUNNER_TEMP/alibooks-headless.zip" -d "$RUNNER_TEMP/alibooks-browser"
          browser="$RUNNER_TEMP/alibooks-browser/chrome-headless-shell-linux64/chrome-headless-shell"
          test -x "$browser"
          echo "CHROME_PATH=$browser" >> "$GITHUB_ENV"

      - name: Run frontend release gate
        working-directory: frontend
        run: npm run check:release

  push-images:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Backend image metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/cloudshop-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Frontend image metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/cloudshop-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
